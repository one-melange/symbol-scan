name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (macOS)
    # SymbolScan targets macOS 26.5, so the runner needs Xcode 26.5+. Pin to `macos-26`
    # once it's broadly available if `macos-latest` lags behind.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Run tests
        working-directory: SymbolScan
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SymbolScan \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: SymbolScan/TestResults.xcresult
          if-no-files-found: ignore
